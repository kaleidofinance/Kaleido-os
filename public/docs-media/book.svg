<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="One lending book with two sides: borrow requests waiting to be filled, and lend listings waiting to be taken. Filling a request makes you the lender; taking a listing makes you the borrower.">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .bg{fill:#111110}
    .h{fill:#ffffff;font-size:13px;font-weight:600}
    .m{fill:#a8a49b;font-size:11px}
    .e{fill:#6b6760;font-size:10px;font-weight:600;letter-spacing:.08em}
    .g{fill:#00b383;font-size:11px;font-weight:600}
    .num{fill:#a8a49b;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .box{fill:#ffffff;fill-opacity:.04;stroke:#ffffff;stroke-opacity:.1}
    .row{fill:#ffffff;fill-opacity:.045;stroke:none}
    .rule{stroke:#ffffff;stroke-opacity:.1;fill:none}
    @media (prefers-color-scheme:light){
      .bg{fill:#ffffff}
      .h{fill:#141413}
      .m,.num{fill:#6d6b63}
      .e{fill:#9c988e}
      .g{fill:#12a866}
      .box{fill:#141413;fill-opacity:.03;stroke:#141413;stroke-opacity:.1}
      .row{fill:#141413;fill-opacity:.04}
      .rule{stroke:#141413;stroke-opacity:.1}
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="300"/>

  <g transform="translate(0,10)">
    <text class="e" x="24" y="18">THEY WANT TO BORROW</text>
    <text class="e" x="380" y="18">THEY WILL LEND</text>

    <rect class="box" x="24" y="28" width="316" height="140" rx="12"/>
    <rect class="row" x="36" y="44" width="292" height="28" rx="6"/>
    <text class="num" x="48" y="63">5,000 USDC</text>
    <text class="num" x="258" y="63" text-anchor="end">7.5%</text>
    <text class="num" x="316" y="63" text-anchor="end">30d</text>
    <rect class="row" x="36" y="80" width="292" height="28" rx="6"/>
    <text class="num" x="48" y="99">1,200 USDC</text>
    <text class="num" x="258" y="99" text-anchor="end">9.0%</text>
    <text class="num" x="316" y="99" text-anchor="end">14d</text>
    <rect class="row" x="36" y="116" width="292" height="28" rx="6"/>
    <text class="num" x="48" y="135">25,000 USDT</text>
    <text class="num" x="258" y="135" text-anchor="end">6.5%</text>
    <text class="num" x="316" y="135" text-anchor="end">90d</text>

    <rect class="box" x="380" y="28" width="316" height="140" rx="12"/>
    <rect class="row" x="392" y="44" width="292" height="28" rx="6"/>
    <text class="num" x="404" y="63">10,000 USDC</text>
    <text class="num" x="614" y="63" text-anchor="end">6.0%</text>
    <text class="num" x="672" y="63" text-anchor="end">60d</text>
    <rect class="row" x="392" y="80" width="292" height="28" rx="6"/>
    <text class="num" x="404" y="99">3,000 USDe</text>
    <text class="num" x="614" y="99" text-anchor="end">5.5%</text>
    <text class="num" x="672" y="99" text-anchor="end">30d</text>
    <rect class="row" x="392" y="116" width="292" height="28" rx="6"/>
    <text class="num" x="404" y="135">50,000 USDC</text>
    <text class="num" x="614" y="135" text-anchor="end">7.0%</text>
    <text class="num" x="672" y="135" text-anchor="end">180d</text>

    <text class="g" x="24" y="192">Fill one and you are the lender</text>
    <text class="g" x="380" y="192">Take one and you are the borrower</text>

    <line class="rule" x1="24" y1="212" x2="696" y2="212"/>
    <text class="h" x="24" y="238">Whoever borrows posts collateral first</text>
    <text class="m" x="24" y="258">The rate and the term are whatever the two sides agreed. The health factor is not.</text>
    <text class="m" x="24" y="274">It is checked by the contract, on every action that could move it.</text>
  </g>
</svg>
