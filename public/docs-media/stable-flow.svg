<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" role="img" aria-label="Collateral is minted into kfUSD and kfUSD can be locked for kafUSD. Unwinding runs the other way: request a withdrawal naming an amount, wait seven days, complete it and get back the asset you locked, then redeem kfUSD for collateral.">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .bg{fill:#111110}
    .h{fill:#ffffff;font-size:13px;font-weight:600}
    .m{fill:#a8a49b;font-size:11px}
    .e{fill:#6b6760;font-size:10px;font-weight:600;letter-spacing:.08em}
    .g{fill:#00b383;font-size:11px;font-weight:600}
    .box{fill:#ffffff;fill-opacity:.04;stroke:#ffffff;stroke-opacity:.1}
    .acc{fill:#00b383;fill-opacity:.1;stroke:#00b383;stroke-opacity:.45}
    .ln,.mk{stroke:#6b6760;fill:none}
    .rule{stroke:#ffffff;stroke-opacity:.1;fill:none}
    @media (prefers-color-scheme:light){
      .bg{fill:#ffffff}
      .h{fill:#141413}
      .m{fill:#6d6b63}
      .e{fill:#9c988e}
      .g{fill:#12a866}
      .box{fill:#141413;fill-opacity:.03;stroke:#141413;stroke-opacity:.1}
      .acc{fill:#12a866;fill-opacity:.08;stroke:#12a866;stroke-opacity:.4}
      .ln,.mk{stroke:#9c988e}
      .rule{stroke:#141413;stroke-opacity:.1}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="mk" d="M0 0.5 L7 4 L0 7.5" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="322"/>

  <g transform="translate(0,10)">
    <text class="e" x="24" y="14">GOING IN</text>

    <rect class="box" x="24" y="26" width="200" height="60" rx="10"/>
    <text class="h" x="40" y="50">Collateral</text>
    <text class="m" x="40" y="68">USDC · USDT · USDe</text>

    <path class="ln" d="M228 56 L256 56" marker-end="url(#a)"/>
    <text class="g" x="242" y="44" text-anchor="middle">mint</text>

    <rect class="acc" x="260" y="26" width="200" height="60" rx="10"/>
    <text class="h" x="276" y="50">kfUSD</text>
    <text class="m" x="276" y="68">Backed by what minted it</text>

    <path class="ln" d="M464 56 L492 56" marker-end="url(#a)"/>
    <text class="g" x="478" y="44" text-anchor="middle">lock</text>

    <rect class="acc" x="496" y="26" width="200" height="60" rx="10"/>
    <text class="h" x="512" y="50">kafUSD</text>
    <text class="m" x="512" y="68">Yield accrues while held</text>

    <!-- redeem, straight back out of kfUSD -->
    <path class="ln" d="M300 90 L300 116 L64 116 L64 92" marker-end="url(#a)"/>
    <text class="g" x="182" y="132" text-anchor="middle">redeem — back to any supported collateral</text>

    <line class="rule" x1="24" y1="152" x2="696" y2="152"/>
    <text class="e" x="24" y="176">COMING BACK OUT</text>

    <rect class="box" x="24" y="188" width="200" height="60" rx="10"/>
    <text class="h" x="40" y="212">Request</text>
    <text class="m" x="40" y="230">Names the amount</text>

    <path class="ln" d="M228 218 L256 218" marker-end="url(#a)"/>

    <rect class="box" x="260" y="188" width="200" height="60" rx="10"/>
    <text class="h" x="276" y="212">Wait</text>
    <text class="m" x="276" y="230">Seven days, on chain</text>

    <path class="ln" d="M464 218 L492 218" marker-end="url(#a)"/>

    <rect class="acc" x="496" y="188" width="200" height="60" rx="10"/>
    <text class="h" x="512" y="212">Complete</text>
    <text class="m" x="512" y="230">Returns what you locked</text>

    <text class="m" x="24" y="278">Unlocking hands back the same asset you locked, not collateral. To leave entirely,</text>
    <text class="m" x="24" y="294">redeem the kfUSD you get back — that is the second step, and a separate decision.</text>
  </g>
</svg>
