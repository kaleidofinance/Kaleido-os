<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" role="img" aria-label="A liquidity range drawn on a price axis. The band earns fees while the price sits inside it; below the band the position is entirely WETH and above it entirely USDC, and neither earns.">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .bg{fill:#111110}
    .h{fill:#ffffff;font-size:13px;font-weight:600}
    .m{fill:#a8a49b;font-size:11px}
    .e{fill:#6b6760;font-size:10px;font-weight:600;letter-spacing:.08em}
    .g{fill:#00b383;font-size:11px;font-weight:600}
    .num{fill:#a8a49b;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .acc{fill:#00b383;fill-opacity:.12;stroke:#00b383;stroke-opacity:.5}
    .dead{fill:#ffffff;fill-opacity:.035;stroke:#ffffff;stroke-opacity:.07}
    .ax{stroke:#6b6760;fill:none}
    .tick{stroke:#6b6760;stroke-opacity:.6;fill:none}
    .spot{stroke:#00b383;fill:none}
    @media (prefers-color-scheme:light){
      .bg{fill:#ffffff}
      .h{fill:#141413}
      .m,.num{fill:#6d6b63}
      .e{fill:#9c988e}
      .g{fill:#12a866}
      .acc{fill:#12a866;fill-opacity:.1;stroke:#12a866;stroke-opacity:.45}
      .dead{fill:#141413;fill-opacity:.03;stroke:#141413;stroke-opacity:.07}
      .ax,.tick{stroke:#9c988e}
      .spot{stroke:#12a866}
    }
  </style>

  <rect class="bg" x="0" y="0" width="720" height="262"/>

  <g transform="translate(0,10)">
    <text class="e" x="24" y="20">USDC PER WETH</text>

    <!-- dead zones -->
    <rect class="dead" x="60" y="88" width="133" height="82"/>
    <rect class="dead" x="504" y="88" width="156" height="82"/>
    <text class="m" x="126" y="120" text-anchor="middle">all WETH</text>
    <text class="m" x="126" y="136" text-anchor="middle">no fees</text>
    <text class="m" x="582" y="120" text-anchor="middle">all USDC</text>
    <text class="m" x="582" y="136" text-anchor="middle">no fees</text>

    <!-- the range -->
    <rect class="acc" x="193" y="76" width="311" height="94" rx="3"/>
    <text class="h" x="348" y="112" text-anchor="middle">your range</text>
    <text class="g" x="348" y="132" text-anchor="middle">fees accrue while the price is in here</text>

    <!-- spot -->
    <line class="spot" x1="347" y1="60" x2="347" y2="176" stroke-dasharray="3 3"/>
    <text class="g" x="347" y="52" text-anchor="middle">1,834.61 now</text>

    <!-- axis -->
    <line class="ax" x1="60" y1="170" x2="660" y2="170"/>
    <g class="tick">
      <line x1="90" y1="170" x2="90" y2="177"/><line x1="120" y1="170" x2="120" y2="177"/>
      <line x1="150" y1="170" x2="150" y2="177"/><line x1="180" y1="170" x2="180" y2="177"/>
      <line x1="210" y1="170" x2="210" y2="177"/><line x1="240" y1="170" x2="240" y2="177"/>
      <line x1="270" y1="170" x2="270" y2="177"/><line x1="300" y1="170" x2="300" y2="177"/>
      <line x1="330" y1="170" x2="330" y2="177"/><line x1="360" y1="170" x2="360" y2="177"/>
      <line x1="390" y1="170" x2="390" y2="177"/><line x1="420" y1="170" x2="420" y2="177"/>
      <line x1="450" y1="170" x2="450" y2="177"/><line x1="480" y1="170" x2="480" y2="177"/>
      <line x1="510" y1="170" x2="510" y2="177"/><line x1="540" y1="170" x2="540" y2="177"/>
      <line x1="570" y1="170" x2="570" y2="177"/><line x1="600" y1="170" x2="600" y2="177"/>
      <line x1="630" y1="170" x2="630" y2="177"/>
    </g>
    <text class="num" x="193" y="196" text-anchor="middle">1,655.79</text>
    <text class="num" x="504" y="196" text-anchor="middle">2,018.32</text>

    <text class="m" x="24" y="220">Asking for ±10% produced these bounds — the request is snapped to the fee</text>
    <text class="m" x="24" y="234">tier's tick spacing, which is why they are not exactly 10% either side.</text>
  </g>
</svg>
