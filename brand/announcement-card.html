<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Kaleido announcement card — TEMPLATE. Do not edit this file to make a card.
  Write a small JSON file and render it:  node brand/render-card.mjs my-card.json
  See brand/README.md. The renderer injects window.__CARD__ below and screenshots.

  Variety is built in: `layout` (left|center|right) and `effect`
  (wash|spotlight|bottom|duotone) change the posture and the backdrop treatment.
  Omit any of layout/effect/background and the kit picks a stable-but-varied
  combination from the card's own text, so no two announcements look the same.
-->
<style>
  @font-face{font-family:"KSerif";src:url("../src/app/fonts/lora-var.woff2") format("woff2");font-weight:100 900;font-display:block}
  @font-face{font-family:"KSans";src:url("../src/app/fonts/GeistVF.woff") format("woff");font-weight:100 900;font-display:block}
  :root{--ink:#0a1512;--text:#f4eee5;--muted:#eaf1ea;--green:#35d18d;--sand:#e7d7b6}
  *{box-sizing:border-box;margin:0}
  html,body{width:100%;height:100%;background:var(--ink)}
  .card{
    position:relative;isolation:isolate;overflow:hidden;
    width:100vw;height:100vh;padding:5.4vh 6vw;
    display:flex;flex-direction:column;justify-content:space-between;
    font-family:"KSans",system-ui,sans-serif;color:var(--text);
    background:var(--ink) center/cover no-repeat;
  }
  .card>*{position:relative;z-index:1}

  /* ---- posture (layout) ---- */
  .card.left  {align-items:flex-start;text-align:left}
  .card.center{align-items:center;text-align:center}
  .card.right {align-items:flex-end;text-align:right}
  .brand{align-self:flex-start} /* logo stays top-left in every posture */
  .card.center .sub{margin-inline:auto}
  .card.right  .sub{margin-left:auto}

  /* ---- backdrop effects (the ::before wash over the photo) ---- */
  .card::before{content:"";position:absolute;inset:0;z-index:0}
  /* wash — directional dark, clears toward the empty side so the arena reads */
  .card.fx-wash.left::before{background:
    linear-gradient(96deg, rgba(6,15,12,.94) 0%, rgba(6,15,12,.82) 30%, rgba(6,15,12,.5) 58%, rgba(6,15,12,.22) 84%, rgba(6,15,12,.1) 100%),
    linear-gradient(180deg, rgba(6,15,12,.3) 0%, transparent 24%, transparent 60%, rgba(6,15,12,.62) 100%),
    radial-gradient(46% 60% at 92% 8%, rgba(53,209,141,.20), transparent 60%)}
  .card.fx-wash.right::before{background:
    linear-gradient(264deg, rgba(6,15,12,.94) 0%, rgba(6,15,12,.82) 30%, rgba(6,15,12,.5) 58%, rgba(6,15,12,.22) 84%, rgba(6,15,12,.1) 100%),
    linear-gradient(180deg, rgba(6,15,12,.3) 0%, transparent 24%, transparent 60%, rgba(6,15,12,.62) 100%),
    radial-gradient(46% 60% at 8% 8%, rgba(53,209,141,.20), transparent 60%)}
  .card.fx-wash.center::before{background:
    radial-gradient(66% 60% at 50% 50%, rgba(6,15,12,.62) 0%, rgba(6,15,12,.4) 60%, transparent 100%),
    linear-gradient(180deg, rgba(6,15,12,.82) 0%, rgba(6,15,12,.45) 32%, rgba(6,15,12,.5) 62%, rgba(6,15,12,.88) 100%),
    radial-gradient(60% 50% at 50% 6%, rgba(53,209,141,.16), transparent 62%)}
  /* spotlight — clear centre, dark corners; a stiller, editorial posture */
  .card.fx-spotlight::before{background:
    radial-gradient(74% 92% at 50% 47%, rgba(6,15,12,.34) 0%, rgba(6,15,12,.56) 52%, rgba(6,15,12,.95) 100%),
    linear-gradient(180deg, rgba(6,15,12,.6) 0%, rgba(6,15,12,.2) 24%, rgba(6,15,12,.24) 64%, rgba(6,15,12,.8) 100%)}
  /* bottom — clear sky up top, weight and text at the base */
  .card.fx-bottom{justify-content:flex-end;gap:26px}
  .card.fx-bottom .mid{margin:0}
  .card.fx-bottom::before{background:
    linear-gradient(180deg, rgba(6,15,12,.28) 0%, transparent 30%, rgba(6,15,12,.55) 62%, rgba(6,15,12,.95) 100%),
    radial-gradient(50% 40% at 88% 6%, rgba(53,209,141,.18), transparent 60%)}
  /* duotone — green-ink tint for a stylised, non-photographic look */
  .card.fx-duotone{background-blend-mode:luminosity}
  .card.fx-duotone::before{background:
    linear-gradient(120deg, rgba(0,74,54,.62) 0%, rgba(6,15,12,.72) 60%, rgba(6,15,12,.9) 100%),
    radial-gradient(60% 70% at 84% 10%, rgba(53,209,141,.24), transparent 60%)}
  .card.plain::before{background:
    radial-gradient(46% 62% at 88% 6%, rgba(53,209,141,.22), transparent 60%),
    radial-gradient(60% 60% at 6% 98%, rgba(4,33,26,.85), transparent 62%)}

  /* ---- type (bigger) ---- */
  .brand{display:flex;align-items:center;gap:16px}
  .badge{width:58px;height:58px;border-radius:50%;background:#0c1a15 url("../public/newklogo2.png") center/cover no-repeat;
    box-shadow:0 0 0 1px rgba(231,215,182,.28),0 0 26px rgba(53,209,141,.28);flex:none}
  .word{font-family:"KSerif",Georgia,serif;font-weight:600;font-size:42px;letter-spacing:-.01em}
  .word i{font-style:normal;color:var(--green)}

  .mid{margin-top:auto;margin-bottom:auto;max-width:100%}
  .eyebrow{color:var(--green);font-weight:700;font-size:20px;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 1px 12px rgba(0,0,0,.85)}
  .hero{font-family:"KSerif",Georgia,serif;font-weight:600;color:#fff;font-size:150px;line-height:.94;letter-spacing:-.035em;margin:18px 0 6px;text-shadow:0 3px 34px rgba(0,0,0,.55)}
  .hero.small{font-size:104px;line-height:1.0;letter-spacing:-.03em}
  .hero .u{color:var(--green);font-size:.38em;letter-spacing:-.01em;margin-left:.12em}
  .sub{max-width:60%;color:var(--muted);font-size:27px;line-height:1.4;margin-top:18px;text-shadow:0 1px 14px rgba(0,0,0,.85)}
  .card.center .sub{max-width:74%}
  .sub b{color:#fff;font-weight:600}

  .foot{display:flex;flex-direction:column;gap:22px;width:100%}
  .card.center .foot{align-items:center}
  .card.right .foot{align-items:flex-end}
  .stats{display:flex;align-items:center;gap:30px;flex-wrap:wrap;font-size:24px;color:var(--text)}
  .card.center .stats{justify-content:center}
  .card.right .stats{justify-content:flex-end}
  .stats .s{display:flex;align-items:center;gap:11px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .stats .s b{color:var(--green);font-weight:600}
  .stats .dot{width:5px;height:5px;border-radius:50%;background:rgba(231,215,182,.5)}
  .arc{width:29px;height:29px;object-fit:contain;flex:none}
  .url{font-family:"KSerif",Georgia,serif;font-weight:700;font-size:34px;color:var(--green);letter-spacing:-.01em}
  .url:empty{display:none}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="brand"><span class="badge"></span><span class="word">Kaleido<i>fi</i></span></div>
    <div class="mid">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="hero" id="hero"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="foot">
      <div class="stats" id="stats"></div>
      <div class="url" id="url"></div>
    </div>
  </main>

  <script>
    /* The renderer replaces the next line with the card's data. */
    window.__CARD__ = window.__CARD__ || /*__CARD__*/ {
      eyebrow: "Kaleido Season 1 · Arc mainnet",
      hero: "2,321,529", heroUnit: "$kPoint",
      sub: "Distributed to the community so far — through launch tasks and early trades with **Luca**, your onchain trading agent on Arc.",
      stats: ["Live on Arc", { v: "6,920", k: "wallets earning" }],
      url: "kaleidofi.xyz/rewards",
    };

    const BACKDROPS = {
      "colosseum-bright": "../public/waitlist-colosseum.webp",
      "colosseum-dark": "../public/hero-colosseum.webp",
      "colosseum": "../public/colosseum.webp",
      "colosseum-exterior": "../public/colosseum.webp",
      "plain": null,
    };
    const LAYOUTS = ["left", "center", "right"]; // "right" is opt-in only
    const LAYOUTS_AUTO = ["left", "center"];     // these backdrops put the building right/centre, so auto never right-aligns text over it
    const EFFECTS = ["wash", "spotlight", "bottom", "duotone"];
    const BGS = ["colosseum-dark", "colosseum-bright", "colosseum-exterior"];

    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    /* Stable hash of the copy → a varied-but-deterministic look when unspecified,
       so cards differ from one another without anyone choosing each time. */
    const hash = (s) => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

    const C = window.__CARD__;
    const seed = hash((C.eyebrow || "") + "|" + (C.hero || ""));

    /* Legibility is decided as one system across background + layout + effect,
       because the combos that wash out are the cross ones (centred text on a
       bright sky, text right-aligned over the building). An explicit value in
       the JSON always wins — then legibility is the author's call.

       1. Background intent first: is a bright arena pinned? */
    const BRIGHT = ["colosseum-bright", "colosseum-exterior"];
    const explicitBg = C.background in BACKDROPS;
    const bgIsBright = explicitBg && BRIGHT.includes(C.background);

    /* 2. Layout: over a bright backdrop, auto stays LEFT (text on the washed
          side); otherwise it may centre. "right" is opt-in only. */
    const layout = LAYOUTS.includes(C.layout)
      ? C.layout
      : bgIsBright
        ? "left"
        : LAYOUTS_AUTO[seed % LAYOUTS_AUTO.length];

    /* 3. Effect: auto avoids duotone. */
    const effect = EFFECTS.includes(C.effect) ? C.effect : EFFECTS[(seed >> 3) % 3];

    /* 4. Background (when not pinned): text over the MIDDLE (centred, spotlight,
          duotone) reads only on the dark arena; left-aligned may use a bright one. */
    const wantsDark = layout === "center" || effect === "spotlight" || effect === "duotone";
    const background = explicitBg
      ? C.background
      : wantsDark
        ? "colosseum-dark"
        : BGS[(seed >> 6) % BGS.length];

    const card = document.getElementById("card");
    card.classList.add(layout, "fx-" + effect);
    const bg = BACKDROPS[background];
    if (bg) card.style.backgroundImage = `url("${bg}")`;
    else card.classList.add("plain");

    document.getElementById("eyebrow").textContent = C.eyebrow || "";
    const hero = document.getElementById("hero");
    hero.innerHTML = esc(C.hero || "") + (C.heroUnit ? `<span class="u">${esc(C.heroUnit)}</span>` : "");
    if ((C.hero || "").length > 16) hero.classList.add("small"); // a sentence, not a stat
    const sub = document.getElementById("sub");
    if (C.sub) sub.innerHTML = md(C.sub); else sub.style.display = "none";

    const stats = document.getElementById("stats");
    (C.stats || []).forEach((item, i) => {
      if (i > 0) { const d = document.createElement("span"); d.className = "dot"; stats.appendChild(d); }
      const s = document.createElement("span"); s.className = "s";
      if (i === 0 && C.arc) { const a = document.createElement("img"); a.className = "arc"; a.src = "../public/arc-mark.png"; a.alt = ""; s.appendChild(a); }
      if (item && typeof item === "object") s.innerHTML += `<b>${esc(item.v)}</b> ${esc(item.k)}`;
      else s.innerHTML += esc(item);
      stats.appendChild(s);
    });
    document.getElementById("url").textContent = C.url || "";
  </script>
</body>
</html>
