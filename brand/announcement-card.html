<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Kaleido announcement card — TEMPLATE. Do not edit this file to make a card.
  Write a small JSON file and render it:  node brand/render-card.mjs my-card.json
  See brand/README.md. The renderer injects window.__CARD__ below and screenshots.
-->
<style>
  @font-face{font-family:"KSerif";src:url("../src/app/fonts/lora-var.woff2") format("woff2");font-weight:100 900;font-display:block}
  @font-face{font-family:"KSans";src:url("../src/app/fonts/GeistVF.woff") format("woff");font-weight:100 900;font-display:block}
  :root{--ink:#0a1512;--text:#f4eee5;--muted:#d3ddd4;--green:#35d18d;--sand:#e7d7b6}
  *{box-sizing:border-box;margin:0}
  html,body{width:100%;height:100%;background:var(--ink)}
  .card{
    position:relative;isolation:isolate;overflow:hidden;
    width:100vw;height:100vh;padding:5.2vh 6vw;
    display:flex;flex-direction:column;justify-content:space-between;
    font-family:"KSans",system-ui,sans-serif;color:var(--text);
    background:var(--ink) center/cover no-repeat;
  }
  /* Legibility wash — dark where the type sits (left), clearing right so the
     backdrop reads; soft floor; faint green top-right glow. */
  .card::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:
      linear-gradient(96deg, rgba(6,15,12,.93) 0%, rgba(6,15,12,.82) 30%, rgba(6,15,12,.5) 58%, rgba(6,15,12,.24) 82%, rgba(6,15,12,.12) 100%),
      linear-gradient(180deg, rgba(6,15,12,.34) 0%, transparent 26%, transparent 60%, rgba(6,15,12,.68) 100%),
      radial-gradient(46% 60% at 92% 8%, rgba(53,209,141,.20), transparent 60%);
  }
  .card.plain::before{
    background:
      radial-gradient(46% 62% at 88% 6%, rgba(53,209,141,.20), transparent 60%),
      radial-gradient(60% 60% at 6% 98%, rgba(4,33,26,.85), transparent 62%);
  }
  .card>*{position:relative;z-index:1}

  .brand{display:flex;align-items:center;gap:15px}
  .badge{width:54px;height:54px;border-radius:50%;background:#0c1a15 url("../public/newklogo2.png") center/cover no-repeat;
    box-shadow:0 0 0 1px rgba(231,215,182,.28),0 0 26px rgba(53,209,141,.28);flex:none}
  .word{font-family:"KSerif",Georgia,serif;font-weight:600;font-size:37px;letter-spacing:-.01em}
  .word i{font-style:normal;color:var(--green)}

  .mid{margin-top:auto;margin-bottom:auto}
  .eyebrow{color:var(--green);font-weight:600;font-size:17px;letter-spacing:.19em;text-transform:uppercase}
  .hero{font-family:"KSerif",Georgia,serif;font-weight:600;color:#fff;font-size:108px;line-height:.96;letter-spacing:-.035em;margin:16px 0 4px;text-shadow:0 2px 30px rgba(0,0,0,.5)}
  .hero.small{font-size:66px;line-height:1.02}
  .hero .u{color:var(--green);font-size:.4em;letter-spacing:-.01em;margin-left:.12em}
  .sub{max-width:62%;color:var(--muted);font-size:22px;line-height:1.42;margin-top:14px;text-shadow:0 1px 12px rgba(0,0,0,.55)}
  .sub b{color:#fff;font-weight:600}

  .foot{display:flex;flex-direction:column;gap:20px}
  .stats{display:flex;align-items:center;gap:28px;flex-wrap:wrap;font-size:21px;color:var(--text)}
  .stats .s{display:flex;align-items:center;gap:10px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
  .stats .s b{color:var(--green);font-weight:600}
  .stats .dot{width:4px;height:4px;border-radius:50%;background:rgba(231,215,182,.5)}
  .arc{width:26px;height:26px;object-fit:contain;flex:none}
  .url{font-family:"KSerif",Georgia,serif;font-weight:700;font-size:30px;color:var(--green);letter-spacing:-.01em}
  .url:empty{display:none}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="brand"><span class="badge"></span><span class="word">Kaleido<i>fi</i></span></div>
    <div class="mid">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="hero" id="hero"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="foot">
      <div class="stats" id="stats"></div>
      <div class="url" id="url"></div>
    </div>
  </main>

  <script>
    /* The renderer replaces the next line with the card's data. */
    window.__CARD__ = window.__CARD__ || /*__CARD__*/ {
      eyebrow: "Kaleido Season 1 · Arc mainnet",
      hero: "2,321,529", heroUnit: "$kPoint",
      sub: "Distributed to the community so far — through launch tasks and early trades with **Luca**, your onchain trading agent on Arc. And counting.",
      stats: ["Live on Arc", { v: "6,920", k: "wallets earning" }, { v: "4,094", k: "explorers joined" }],
      url: "kaleidofi.xyz/rewards",
      background: "colosseum-bright", arc: true,
    };

    const BACKDROPS = {
      "colosseum-bright": "../public/waitlist-colosseum.webp",
      "colosseum-dark": "../public/hero-colosseum.webp",
      "colosseum": "../public/colosseum.webp",
      "plain": null,
    };
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); // **bold** only

    const C = window.__CARD__;
    const card = document.getElementById("card");
    const bg = BACKDROPS[C.background] ?? BACKDROPS["colosseum-bright"];
    if (bg) card.style.backgroundImage = `url("${bg}")`;
    else card.classList.add("plain");

    document.getElementById("eyebrow").textContent = C.eyebrow || "";
    const hero = document.getElementById("hero");
    hero.innerHTML = esc(C.hero || "") + (C.heroUnit ? `<span class="u">${esc(C.heroUnit)}</span>` : "");
    if ((C.hero || "").length > 16) hero.classList.add("small"); // a sentence headline, not a stat
    const sub = document.getElementById("sub");
    if (C.sub) sub.innerHTML = md(C.sub); else sub.style.display = "none";

    const stats = document.getElementById("stats");
    (C.stats || []).forEach((item, i) => {
      if (i > 0) { const d = document.createElement("span"); d.className = "dot"; stats.appendChild(d); }
      const s = document.createElement("span"); s.className = "s";
      if (i === 0 && C.arc) { const a = document.createElement("img"); a.className = "arc"; a.src = "../public/arc-mark.png"; a.alt = ""; s.appendChild(a); }
      if (item && typeof item === "object") s.innerHTML += `<b>${esc(item.v)}</b> ${esc(item.k)}`;
      else s.innerHTML += esc(item);
      stats.appendChild(s);
    });
    document.getElementById("url").textContent = C.url || "";
  </script>
</body>
</html>
