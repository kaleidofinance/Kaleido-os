<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_mockbase.css">
<style>
  .tabs{display:flex;gap:4px;justify-content:center;margin-bottom:14px}
  .tab{font-size:var(--k-fs-sm);color:var(--k-t2);padding:8px 16px;border-radius:var(--k-r-pill)}
  .tab.on{background:var(--k-card);color:var(--k-t1);font-weight:var(--k-fw-med);box-shadow:0 0 0 1px rgba(255,255,255,.05),0 2px 6px rgba(0,0,0,.6)}
  .card{width:520px;display:flex;flex-direction:column;gap:4px;position:relative}
  .settings{position:absolute;top:17px;right:18px;display:flex;align-items:center;gap:6px;z-index:3}
  .qk{background:var(--k-glass-deep);box-shadow:var(--k-shadow-inset);border:0;font:inherit;font-size:var(--k-fs-xs);
    color:var(--k-t2);padding:4px 10px;border-radius:var(--k-r-pill);cursor:pointer}
  .gear{display:inline-flex;align-items:center;gap:5px;background:var(--k-glass-deep);box-shadow:var(--k-shadow-inset);
    color:var(--k-t2);padding:4px 10px;border-radius:var(--k-r-pill);font-size:var(--k-fs-xs)}
  .box{background:var(--k-card);border:1px solid var(--k-line);border-radius:var(--k-r-xl);padding:17px 18px;
    box-shadow:inset 0 1px 0 rgba(250,249,245,.06),0 12px 30px rgba(0,0,0,.5)}
  .deep{background:#141312;box-shadow:var(--k-shadow-inset),0 12px 30px rgba(0,0,0,.5)}
  .bl{font-size:var(--k-fs-sm);color:var(--k-t2);margin-bottom:9px}
  .amt{display:flex;align-items:center;gap:var(--k-s3)}
  .inp{flex:1;min-width:0;border:0;background:none;color:var(--k-t1);font:inherit;font-size:34px;font-weight:var(--k-fw-body);letter-spacing:-.025em}
  .pill{display:flex;align-items:center;gap:var(--k-s2);background:var(--k-glass-deep);box-shadow:var(--k-shadow-inset);
    border:0;font:inherit;font-size:var(--k-fs-base);font-weight:var(--k-fw-med);color:var(--k-t1);
    padding:6px 13px 6px 6px;border-radius:var(--k-r-pill);flex:none}
  .cv{font-size:12px;color:var(--k-t2)}
  .sub{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:var(--k-fs-sm);color:var(--k-t2);min-height:20px}
  .sub b{color:var(--k-t1);font-weight:var(--k-fw-body)}
  .linkRow{position:relative;height:0}
  .arw{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:36px;height:36px;border-radius:11px;
    background:var(--k-well2);border:4px solid var(--k-bg);color:var(--k-t1);display:grid;place-items:center;font-size:15px;z-index:2}
  .cta{width:100%;background:var(--k-brand);color:var(--k-brand-fg);border:0;font:inherit;font-size:17px;font-weight:var(--k-fw-med);
    padding:17px;border-radius:var(--k-r-lg);margin-top:8px}
  .quote{display:flex;align-items:baseline;justify-content:space-between;gap:var(--k-s3);padding:9px 4px 0;font-size:var(--k-fs-sm);color:var(--k-t2)}
  .quote b{color:var(--k-t1);font-weight:var(--k-fw-body)}
</style></head>
<body>
  <div>
    <div class="tabs">
      <span class="tab">Agent</span><span class="tab on">Swap</span><span class="tab">Limit</span>
      <span class="tab">Buy</span><span class="tab">Sell</span>
    </div>
    <div class="card">
      <div class="settings">
        <button class="qk">25%</button><button class="qk">50%</button><button class="qk">75%</button><button class="qk">Max</button>
        <span class="gear">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          Auto
        </span>
      </div>
      <div class="box deep">
        <div class="bl">Sell</div>
        <div class="amt">
          <input class="inp tabular" value="500" readonly>
          <span class="pill"><span class="coin" style="background:#2775ca">$</span>USDC <span class="cv">▾</span></span>
        </div>
        <div class="sub"><span>Balance <b class="tabular">5,000</b></span><span class="tabular">$500.00</span></div>
      </div>
      <div class="linkRow"><span class="arw">↓</span></div>
      <div class="box">
        <div class="bl">Buy</div>
        <div class="amt">
          <input class="inp tabular" value="16,494" readonly>
          <span class="pill"><span class="coin" style="background:var(--k-brand)">K</span>KLD <span class="cv">▾</span></span>
        </div>
        <div class="sub"><span></span><span class="tabular">$499.45</span></div>
      </div>
      <button class="cta">Sign &amp; swap</button>
      <div class="quote">
        <span class="tabular">1 USDC = 33.02 KLD</span>
        <span>Min. received <b class="tabular">16,412 KLD</b></span>
      </div>
    </div>
  </div>
</body></html>
