<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="_mockbase.css">
<style>
  .center{width:560px;display:flex;flex-direction:column;gap:16px;align-items:center}
  .strip{display:flex;justify-content:center;flex-wrap:wrap}
  .stat{padding:0 24px;border-left:1px solid var(--k-line);display:flex;flex-direction:column;gap:3px;align-items:center}
  .stat:first-child{border-left:0}
  .sl{font-size:var(--k-fs-sm);color:var(--k-t2)}
  .sv{font-size:var(--k-fs-xl);letter-spacing:-.02em}
  .sv.good{color:var(--k-pos)}
  .tabs{display:flex;gap:4px}
  .tb{background:none;border:0;font:inherit;font-size:var(--k-fs-sm);color:var(--k-t2);padding:8px 16px;border-radius:var(--k-r-pill)}
  .tb.on{background:var(--k-well2);color:var(--k-t1);font-weight:var(--k-fw-med)}
  .card{width:100%;display:flex;flex-direction:column;gap:4px}
  .box{background:var(--k-card);border:1px solid var(--k-line);border-radius:var(--k-r-xl);padding:17px 18px;
    box-shadow:inset 0 1px 0 rgba(250,249,245,.06),0 12px 30px rgba(0,0,0,.5)}
  .box.deep{background:#141312}
  .bl{font-size:var(--k-fs-sm);color:var(--k-t2);margin-bottom:9px}
  .amt{display:flex;align-items:center;gap:var(--k-s3)}
  .inp{flex:1;min-width:0;border:0;background:none;color:var(--k-t1);font:inherit;font-size:34px;font-weight:var(--k-fw-body);letter-spacing:-.025em}
  .pill{display:flex;align-items:center;gap:var(--k-s2);background:var(--k-glass-deep);box-shadow:var(--k-shadow-inset);
    font-size:var(--k-fs-base);font-weight:var(--k-fw-med);color:var(--k-t1);padding:6px 14px 6px 6px;border-radius:var(--k-r-pill);flex:none}
  .sub{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:var(--k-fs-sm);color:var(--k-t2);min-height:20px}
  .sub b{color:var(--k-t1);font-weight:var(--k-fw-body)}
  .linkRow{position:relative;height:0}
  .arw{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:36px;height:36px;border-radius:11px;
    background:var(--k-well2);border:4px solid var(--k-bg);color:var(--k-t1);display:grid;place-items:center;font-size:15px;z-index:2}
  .kv{display:flex;justify-content:space-between;align-items:center;font-size:var(--k-fs-sm);padding:8px 2px;color:var(--k-t2)}
  .kv b{color:var(--k-t1);font-weight:var(--k-fw-body)}
  .kv b.good{color:var(--k-pos)}
  .cta{width:100%;background:var(--k-brand);color:var(--k-brand-fg);border:0;font:inherit;font-size:17px;font-weight:var(--k-fw-med);
    padding:17px;border-radius:var(--k-r-lg);margin-top:8px}
</style></head>
<body>
  <div class="center">
    <div class="strip">
      <div class="stat"><span class="sl">Total staked</span><span class="sv tabular">4.21M KLD</span></div>
      <div class="stat"><span class="sl">Staking APR</span><span class="sv good tabular">12.4%</span></div>
      <div class="stat"><span class="sl">Your stake</span><span class="sv tabular">92,000 stKLD</span></div>
    </div>
    <div class="tabs"><span class="tb on">Stake</span><span class="tb">Unstake</span></div>
    <div class="card">
      <div class="box deep">
        <div class="bl">Stake</div>
        <div class="amt">
          <input class="inp tabular" value="50,000" readonly>
          <span class="pill"><span class="coin" style="background:var(--k-brand)">K</span>KLD</span>
        </div>
        <div class="sub"><span>Balance <b class="tabular">210,400</b></span><span class="tabular">$1,516</span></div>
      </div>
      <div class="linkRow"><span class="arw">↓</span></div>
      <div class="box">
        <div class="bl">Receive</div>
        <div class="amt">
          <input class="inp tabular" value="46,210" readonly>
          <span class="pill"><span class="coin" style="background:#0a8f66">stK</span>stKLD</span>
        </div>
        <div class="sub"><span></span><span class="tabular">$1,516</span></div>
      </div>
      <div style="padding:6px 2px 0">
        <div class="kv"><span>Staking APR</span><b class="good tabular">12.4%</b></div>
        <div class="kv"><span>Exchange rate</span><b class="tabular">1 stKLD = 1.082 KLD</b></div>
        <div class="kv"><span>Unstake cooldown</span><b class="tabular">7 days</b></div>
      </div>
      <button class="cta">Stake KLD</button>
    </div>
  </div>
</body></html>
