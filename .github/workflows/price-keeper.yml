# Price-feed keeper for the two chains nothing else refreshes.
#
# Arc (5042002) and Robinhood (46630) both enforce a staleness bound on every
# priced call in ProtocolFacet — deposit, borrow, health-factor read, liquidation.
# Miss the window and those operations revert until a fresh price lands. On the
# other three chains a provider (Chainlink / API3) or Pyth's own network relays
# the feeds; on these two, this workflow is what keeps them warm.
#
#   Arc       — Pyth is a PULL oracle. ETH/BTC (600s bound) ARE relayed by Pyth's
#               network continuously, so this keeper leaves them alone; it cannot
#               cover a 600s bound at a 20-minute cadence anyway. It relays only
#               USDC/WUSDC (90000s bound), which nothing else pushes — Arc's own
#               gas token, and the feed that was found dead and growing.
#               → scripts/push-prices.js, PUSH_FEEDS=USDC
#
#               STILL BLOCKED, and not on a key: hermes.pyth.network has answered
#               401 on every path since 2026-08-28, and an Arc push needs a
#               Pyth-SIGNED blob — the CoinGecko fallback that rescued Robinhood
#               cannot help here, because Arc verifies the signature on chain.
#               The choice is a Pyth API key or moving Arc's USDC feed onto a
#               PushablePriceFeed like Robinhood's. Until one of those, expect this
#               job red and Arc's USDC feed ageing toward its 25h bound.
#   Robinhood — self-hosted PushablePriceFeed contracts behind an
#               AggregatorPriceOracle. Nothing but us pushes them. Both feeds
#               (ETH 3600s, USDC 90000s).
#               → scripts/push-aggregator.js
#
# Cadence: the tightest bound this keeper owns is Robinhood ETH at 3600s (1h).
# GitHub's scheduled runs are delayed — and sometimes dropped entirely — under
# load, so every-30-minutes leaves no margin for a skipped run. Every 20 minutes
# gives three windows inside the bound: two consecutive drops still stay fresh.
#
# That margin is theoretical, and measured 2026-09-01 it does not exist: this
# schedule delivered 47 runs in 152 hours — one per 3.2 h against a 1 h bound, so
# GitHub dropped roughly nine of every ten and made none of them up. Tightening
# the cron does not help, because what is dropped is the trigger. So the push also
# exists as an HTTP endpoint that any scheduler can call:
#
#   GET|POST /api/keeper/push   src/app/api/keeper/push/route.ts
#                               src/lib/keeper/pushFeeds.ts   (no hardhat)
#
# It needs KEEPER_PRIVATE_KEY and CRON_SECRET in the app's server environment, and
# it refuses every request until CRON_SECRET is set. It cannot cover Arc — that
# push needs a Pyth-signed blob — so this workflow stays either way, and the two
# cannot collide: a second push of the same observation is refused off-chain by the
# feed's own replay rule, costing a read rather than a transaction.
#
# ── Activation (this workflow is inert until all three are true) ──────────────
#   1. Merged to the DEFAULT branch. GitHub runs `schedule` triggers only from the
#      default branch — on a feature branch this never fires on its own.
#   2. Repo secret KEEPER_PRIVATE_KEY set. Without it hardhat's account list is
#      empty, the push scripts find no signer and fail fast (a red run, by design).
#   3. Actions enabled for the repo.
# Optional secrets ARC_TESTNET_RPC / ROBINHOOD_TESTNET_RPC / HERMES_ENDPOINT
# override the public endpoints the scripts fall back to when they are unset.
#
# ── Why the keeper key and not the deployer's ─────────────────────────────────
#
# This asked for DEPLOYER_PRIVATE_KEY until 2026-09-01, and that was wrong twice
# over. Wrong in principle, because the deployer owns every contract on every chain
# and pushing a price needs none of that: on Arc the push is permissionless (pay
# `getUpdateFee`, call `updatePriceFeeds`), and on Robinhood the feeds accept
# `owner || isPusher[msg.sender]`, so a keeper address named in `isPusher` can push
# and can do nothing else — not re-baseline with `forceAnswer`, not move a bound,
# not name another pusher. Wrong in fact, because that secret was never set: this
# workflow had been red on it for 47 consecutive runs, and while it was red the
# Robinhood ETH/USD feed drifted 3h 32m past its 3600s bound and `getUsdValue`
# reverted `Protocol__StalePrice` for WETH and for native ETH. Lending against ETH
# was down for want of a signer nobody had granted.
#
# The keeper is `0xB37d079F6AccE50332043cf20e1f4FFD363799aE` — the same address the
# orders keeper signs with, granted on both Robinhood feeds by
# `scripts/grant-pusher.js` and funded on both chains. `hardhat.config.js` reads
# DEPLOYER_PRIVATE_KEY first and falls back to this, so a machine holding both
# still deploys as the owner.
#
# TESTNET ONLY, and for a narrower reason than before: a leaked keeper key here
# can push a wrong price inside each feed's deviation guard. Mainnet keeps this
# shape — keeper key for the push, feed and oracle ownership on a multisig.

name: price-keeper

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

# Never let a slow run overlap the next scheduled one; skip rather than queue.
concurrency:
  group: price-keeper
  cancel-in-progress: false

defaults:
  run:
    working-directory: smart-contract

jobs:
  # Two independent jobs on purpose: an Arc RPC outage must not stop the Robinhood
  # push, and vice versa. Each is a full, self-contained keeper for its chain.
  arc:
    name: Arc — relay USDC/WUSDC Pyth update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart-contract/package-lock.json
      - run: npm ci
      - name: Push Arc USDC/WUSDC
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          ARC_TESTNET_RPC: ${{ secrets.ARC_TESTNET_RPC }}
          HERMES_ENDPOINT: ${{ secrets.HERMES_ENDPOINT }}
          # PUSH_ALL forces the push even though USDC is nominally still inside its
          # 25h bound — resetting the clock every run is the point. PUSH_FEEDS
          # scopes it to USDC so we never spend a fee re-pushing the Pyth-relayed
          # ETH/BTC feeds.
          PUSH_ALL: "1"
          PUSH_FEEDS: "USDC"
        run: npx hardhat run scripts/push-prices.js --network arcTestnet

  robinhood:
    name: Robinhood — push ETH + USDC self-hosted feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: smart-contract/package-lock.json
      - run: npm ci
      - name: Push Robinhood feeds
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          ROBINHOOD_TESTNET_RPC: ${{ secrets.ROBINHOOD_TESTNET_RPC }}
          HERMES_ENDPOINT: ${{ secrets.HERMES_ENDPOINT }}
          # Both feeds every run — the tightest bound (ETH 3600s) is the whole
          # reason the cadence is 20 minutes.
          PUSH_ALL: "1"
        run: npx hardhat run scripts/push-aggregator.js --network robinhoodTestnet
